server:
  port: 8057
spring:
  application:
    name: room-service		
  data:
    mongodb:
      host: localhost
      port: 28017
      database: room
      username: root
      password: root
      authentication-database: admin
  kafka:
      bootstrap-servers: localhost:9092
      consumer:
        #group-id: visitor-room-projection
        group-id: visitor-room-projection-2
        auto-offset-reset: earliest # (start from beginning)
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        enable-auto-commit: false
        properties:
          spring.json.trusted.packages: "com.piseth.java.school.*"
          spring.json.use.type.headers: false
#          TypeId: com.piseth.java.school.roomservice.message.event.RoomEventEnvelope
          spring.json.value.default.type: com.piseth.java.school.roomservice.messaging.event.RoomEventEnvelope
        max-poll-records: 100				
logging:
  level:
    root: INFO
    com.piseth.java.school: DEBUG
app:
  messaging:
     topics:
        roomEvents: room.events.v1
